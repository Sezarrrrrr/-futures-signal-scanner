<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>Futures Signal Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef4ff;font-family:Inter,system-ui,-apple-system,sans-serif}
.app{max-width:680px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px;margin:0}.sub{color:#8391a7;font-size:12px;margin-top:3px}
.status{font-size:11px;padding:7px 10px;border-radius:20px;background:#102238;color:#8fa4bf}.live{color:#55e39a}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.stat,.coin{background:#0b1421;border:1px solid #17263a;border-radius:16px}.stat{padding:12px}.stat b{display:block;font-size:18px;margin-top:4px}.green{color:#49e49a}.red{color:#ff6476}.yellow{color:#f5cf62}
.tabs{display:flex;background:#0b1421;border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;color:#8290a4;padding:10px;border-radius:9px;font-weight:700}.tabs .on{background:#16253a;color:#fff}
.coin{padding:14px;margin:9px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.symbol{font-weight:800}.muted{color:#8391a7;font-size:12px}.price{font-weight:700}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:7px}.lb{background:#0b3a2b;color:#55e39a}.sb{background:#421b25;color:#ff7181}
.bar{height:5px;background:#17263a;border-radius:5px;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}.coin small{color:#7d8ba0}.empty{text-align:center;color:#8290a4;padding:40px 10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#07101d;border-top:1px solid #16243a;display:flex;justify-content:center}.bottom div{max-width:680px;width:100%;display:flex;justify-content:space-around;padding:13px 8px;color:#73839a;font-size:11px}.bottom .active{color:#5de5a0}
.note{font-size:11px;color:#6f8098;line-height:1.45;margin:14px 2px}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><h1>TARAMA / FIRSATLAR</h1><div class="sub">Binance Futures • Canlı piyasa verisi</div></div><div id="status" class="status">BAĞLANIYOR</div></div>
  <section class="cards">
    <div class="stat"><span class="muted">LONG</span><b id="long" class="green">—</b></div>
    <div class="stat"><span class="muted">SHORT</span><b id="short" class="red">—</b></div>
    <div class="stat"><span class="muted">COIN</span><b id="count" class="yellow">—</b></div>
  </section>
  <div class="tabs">
    <button id="all" class="on" onclick="setFilter('all')">Tümü</button>
    <button id="longTab" onclick="setFilter('long')">LONG</button>
    <button id="shortTab" onclick="setFilter('short')">SHORT</button>
  </div>
  <div id="list"><div class="empty">Binance verisi bekleniyor…</div></div>
  <p class="note">Bu v1 sürümünde puan, yalnızca 24 saatlik momentum ön skorudur. Finansal tavsiye değildir ve gerçek emir göndermez.</p>
</main>
<div class="bottom"><div><span class="active">⌁ Tarama</span><span>◉ Piyasalar</span><span>＋ İşlem</span><span>▣ Geçmiş</span><span>⚙ Ayarlar</span></div></div>
<script src="app.js"></script>
</body>
</html>
